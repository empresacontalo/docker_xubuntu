version: '3.8'

services:
  xubuntu:
    # Construindo a partir do Dockerfile local para persistir programas instalados no sistema
    build: .
    image: ghcr.io/empresacontalo/docker_xubuntu:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - DATA_DIR=/config/.omniroute
      # Selkies — cursor via browser CSS (fix: cursor invisível no X11)
      - SELKIES_USE_BROWSER_CURSORS=true
      # Selkies — performance e estabilidade
      - SELKIES_ENCODER=x264enc
      - SELKIES_FRAMERATE=30
      - SELKIES_VIDEO_BITRATE=8
      - SELKIES_H264_CRF=25
    cap_add:
      - SYS_ADMIN
    volumes:
      # Diretório para dados pessoais, configurações e perfil do usuário (Webtop persistent)
      - xubuntu_data:/config
      # Dispositivo virtual de entrada para o Selkies (necessário para clique/movimento do mouse e teclado)
      - /dev/uinput:/dev/uinput
      # Workaround para substituir o shm_size no Docker Swarm:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 2147483648 # 2GB em bytes
      # Acesso ao Docker do host para build de imagens e gerenciamento de stacks
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # Mantendo o acesso às outras stacks (que poderão acessá-lo via xubuntu:3000 internamente)
      - app_network
      - npm_swarm
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  xubuntu_data:
    driver: local

networks:
  app_network:
    external: true
    name: app_network
  npm_swarm:
    external: true
    name: npm_swarm
