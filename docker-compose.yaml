version: '3.8'

services:
  xubuntu:
    # Construindo a partir do Dockerfile local para persistir programas instalados no sistema
    build: .
    image: ghcr.io/empresacontalo/docker_xubuntu:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - DATA_DIR=/config/.omniroute
    volumes:
      # Nesta imagem, o diretório usado para dados pessoais e configurações é o /config.
      - xubuntu_data:/config
      - xubuntu_data_root:/root
      - xubuntu_data_home:/home
      - xubuntu_data_opt_completo:/opt
      # Workaround para substituir o shm_size no Docker Swarm:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 2147483648 # 2GB em bytes
      # Acesso ao Docker do host para build de imagens e gerenciamento de stacks
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # Mantendo o acesso às outras stacks (que poderão acessá-lo via xubuntu:3000 internamente)
      - app_network
      - npm_swarm
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  xubuntu_data:
    driver: local
  xubuntu_data_root:
    driver: local
  xubuntu_data_home:
    driver: local
  xubuntu_data_opt_completo:
    driver: local

networks:
  app_network:
    external: true
    name: app_network
  npm_swarm:
    external: true
    name: npm_swarm
